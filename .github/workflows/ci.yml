name: recipes
on: [push, pull_request, workflow_dispatch]
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the candidate mechanism and recipe package
        run: python -m pip install -r requirements-build.txt .
      - name: Run recipe contracts
        run: python -m unittest discover -s tests -v
      - name: Check installed package assets
        shell: python
        run: |
          from forgerecipes import recipe_input_files, cmake_dir
          for name in ('quickjs', 'ngtcp2', 'openssl'):
              assert all(path.is_file() for path in recipe_input_files(name).values())
          assert (cmake_dir() / 'RunOpenSSL-mingw.sh.in').is_file()
