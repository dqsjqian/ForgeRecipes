name: recipes
on: [push, pull_request, workflow_dispatch]
env:
  # The CI scripts print UTF-8 diagnostics; a Windows console defaults
  # to cp1252 and raises UnicodeEncodeError on them.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  # Project policy: only the latest stable CPython is supported and tested.
  PYTHON_VERSION: '3.14'
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, xcode-27, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the candidate mechanism and recipe package
        run: python -m pip install -r requirements-build.txt .
      - name: Run recipe contracts
        run: python -m unittest discover -s tests -v
      - name: Check installed package assets
        shell: python
        run: |
          from forgerecipes import recipe_input_files, cmake_dir
          for name in ('quickjs', 'ngtcp2', 'openssl'):
              assert all(path.is_file() for path in recipe_input_files(name).values())
          assert (cmake_dir() / 'RunOpenSSL-mingw.sh.in').is_file()
